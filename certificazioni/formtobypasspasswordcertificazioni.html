<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richiedi Password Certificazioni — Matteo Pascali</title>
  
  <!-- Favicon / Icona della pagina (Lucchetto) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><path d='M50 25 C38 25 30 33 30 45 L30 52 L25 52 C22 52 20 54 20 57 L20 77 C20 80 22 82 25 82 L75 82 C78 82 80 80 80 77 L80 57 C80 54 78 52 75 52 L70 52 L70 45 C70 33 62 25 50 25 Z M50 33 C57 33 62 38 62 45 L62 52 L38 52 L38 45 C38 38 43 33 50 33 Z' fill='%2360a5fa'/></svg>">

  <link rel="stylesheet" href="formtobypasspasswordcertificazioni.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="feedback-page">

  <!-- NAVBAR SUPERIORE -->
  <header class="site-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">MP</a>
      <a href="index.html" class="back-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Torna all'Accesso
      </a>
    </div>
  </header>

  <!-- FORM A 3 SEZIONI -->
  <main class="form-wrapper">
    <div class="form-card">
      
      <!-- Icona Lucchetto -->
      <div class="form-icon-box">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>

      <div class="form-header">
        <h2>Richiedi Password</h2>
        <p id="step-indicator">Passo 1 di 3</p>
      </div>

      <form id="password-request-form" action="https://formspree.io/f/xaenywwp" method="POST">
        
        <!-- SEZIONE 1 -->
        <div id="step-1" class="form-step active-step">
          <div class="field-group">
            <label for="name">Nome e Cognome</label>
            <input type="text" id="name" name="name" placeholder="Esempio: Mario Rossi" required />
          </div>

          <div class="field-group">
            <label for="email">Email <span class="field-note">(in questa mail riceverai la password)</span></label>
            <input type="email" id="email" name="email" placeholder="nome@esempio.it" required />
          </div>

          <button type="button" id="btn-next-1" class="submit-button">Avanti &rarr;</button>
        </div>

        <!-- SEZIONE 2 -->
        <div id="step-2" class="form-step">
          <div class="field-group">
            <label for="role">Chi sei?</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Seleziona un'opzione...</option>
              <option value="Genitore">Genitore</option>
              <option value="Parente">Parente</option>
              <option value="Docente">Docente</option>
              <option value="Amico">Amico</option>
              <option value="Nessuno (non ti conosco)">Nessuno (non ti conosco)</option>
              <option value="Altro">Altro</option>
            </select>
          </div>

          <!-- Campo dinamico: appare soltanto se viene selezionato "Altro" -->
          <div class="field-group" id="other-role-group" style="display: none;">
            <label for="other_role">Specifica chi sei:</label>
            <input type="text" id="other_role" name="other_role" placeholder="Scrivi qui il tuo ruolo..." />
          </div>

          <div class="button-row">
            <button type="button" id="btn-back-1" class="secondary-button">&larr; Indietro</button>
            <button type="button" id="btn-next-2" class="submit-button">Avanti &rarr;</button>
          </div>
        </div>

        <!-- SEZIONE 3 -->
        <div id="step-3" class="form-step">
          <div class="info-notice">
            <p>La tua richiesta sarà presa in considerazione per ricevere una password. Se sarai idoneo, la riceverai tramite l'email inserita precedentemente.</p>
          </div>

          <div class="button-row">
            <button type="button" id="btn-back-2" class="secondary-button">&larr; Indietro</button>
            <button type="submit" id="submit-btn" class="submit-button">Invia modulo</button>
          </div>
        </div>

        <div id="form-status" class="status-box"></div>

      </form>
    </div>
  </main>

  <script>
    const step1 = document.getElementById("step-1");
    const step2 = document.getElementById("step-2");
    const step3 = document.getElementById("step-3");

    const btnNext1 = document.getElementById("btn-next-1");
    const btnNext2 = document.getElementById("btn-next-2");
    const btnBack1 = document.getElementById("btn-back-1");
    const btnBack2 = document.getElementById("btn-back-2");

    const stepIndicator = document.getElementById("step-indicator");

    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const roleSelect = document.getElementById("role");
    const otherRoleGroup = document.getElementById("other-role-group");
    const otherRoleInput = document.getElementById("other_role");

    // Mostra o nasconde la casella di testo per "Altro"
    roleSelect.addEventListener("change", function() {
      if (this.value === "Altro") {
        otherRoleGroup.style.display = "flex";
        otherRoleInput.setAttribute("required", "required");
      } else {
        otherRoleGroup.style.display = "none";
        otherRoleInput.removeAttribute("required");
        otherRoleInput.value = "";
      }
    });

    // Passaggio Sezione 1 -> Sezione 2
    btnNext1.addEventListener("click", function() {
      if (nameInput.checkValidity() && emailInput.checkValidity()) {
        step1.classList.remove("active-step");
        step2.classList.add("active-step");
        stepIndicator.innerText = "Passo 2 di 3";
      } else {
        nameInput.reportValidity();
        emailInput.reportValidity();
      }
    });

    // Indietro Sezione 2 -> Sezione 1
    btnBack1.addEventListener("click", function() {
      step2.classList.remove("active-step");
      step1.classList.add("active-step");
      stepIndicator.innerText = "Passo 1 di 3";
    });

    // Passaggio Sezione 2 -> Sezione 3
    btnNext2.addEventListener("click", function() {
      if (roleSelect.checkValidity() && (roleSelect.value !== "Altro" || otherRoleInput.checkValidity())) {
        step2.classList.remove("active-step");
        step3.classList.add("active-step");
        stepIndicator.innerText = "Passo 3 di 3";
      } else {
        roleSelect.reportValidity();
        if (roleSelect.value === "Altro") otherRoleInput.reportValidity();
      }
    });

    // Indietro Sezione 3 -> Sezione 2
    btnBack2.addEventListener("click", function() {
      step3.classList.remove("active-step");
      step2.classList.add("active-step");
      stepIndicator.innerText = "Passo 2 di 3";
    });

    // Invio Formspree
    const form = document.getElementById("password-request-form");
    const status = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Invio in corso...";
      status.style.display = "none";
      status.className = "status-box";

      const data = new FormData(form);

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: data,
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          status.innerText = "Modulo inviato con successo! La tua richiesta verrà valutata a breve.";
          status.classList.add("success");
          status.style.display = "block";
          form.reset();
          otherRoleGroup.style.display = "none";
          setTimeout(() => {
            step3.classList.remove("active-step");
            step1.classList.add("active-step");
            stepIndicator.innerText = "Passo 1 di 3";
          }, 4000);
        } else {
          status.innerText = "Errore durante l'invio. Si prega di riprovare.";
          status.classList.add("error");
          status.style.display = "block";
        }
      } catch (error) {
        status.innerText = "Errore di connessione. Riprova più tardi.";
        status.classList.add("error");
        status.style.display = "block";
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Invia modulo";
      }
    });
  </script>

</body>
</html>
