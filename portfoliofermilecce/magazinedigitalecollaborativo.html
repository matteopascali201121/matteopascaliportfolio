<body>

    <header class="top-bar">
        <h1>Magazine Digitale Collaborativo – Unità 8</h1>
    </header>

    <div id="loading-overlay">
        <div class="loader"></div>
        <p id="status-text">Analisi del PDF in HD in corso...</p>
    </div>
    
    <div class="container">
        <!-- Wrapper per la gestione perfetta dello Zoom -->
        <div id="flipbook-wrapper">
            <div id="flipbook">
                <!-- Le pagine verranno create e inserite qui -->
            </div>
        </div>
    </div>

    <!-- Barra dei Controlli -->
    <div class="controls-bar">
        <button id="btn-zoom-in" class="btn">🔍 Ingrandisci (+)</button>
        <button id="btn-zoom-out" class="btn">🔍 Riduci (-)</button>
        <span class="divider">|</span>
        <button id="btn-lock-scroll" class="btn btn-toggle">Blocca Scorrimento</button>
        <button id="btn-lock-links" class="btn btn-toggle">Blocca Link</button>
    </div>

    <script src="magazinedigitalecollaborativo.js"></script>
