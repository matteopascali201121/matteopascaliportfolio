<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giacobbe e Dio - Progetto di Matteo</title>

    <!-- Favicon SVG con iniziali MP -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e2d3d'/><text x='50%' y='55%' dominant-baseline='central' text-anchor='middle' fill='%23ffffff' font-family='sans-serif' font-size='45' font-weight='bold'>MP</text></svg>">

    <!-- Tailwind CSS per uno stile moderno e reattivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        apollo: {
                            50: '#f4f7f9',
                            100: '#e9eff3',
                            500: '#396d90', // Blu Acciaio (rgb: 57, 109, 144)
                            600: '#2d5672', // Blu Acciaio scuro per hover
                            900: '#1e2d3d'
                        },
                        sfondo: '#f0f2f5', // Grigio Chiaro (rgb: 240, 242, 245)
                        bianco: '#ffffff'  // Bianco (rgb: 255, 255, 255)
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f0f2f5;
            background-image: radial-gradient(circle at center, #ffffff 0%, #f0f2f5 100%);
            min-height: 100vh;
        }
        /* Pannello bianco con ombreggiatura morbida e moderna */
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 25px -5px rgba(57, 109, 144, 0.08), 0 8px 10px -6px rgba(57, 109, 144, 0.08);
        }
        /* Nasconde la barra di scorrimento ma permette lo swipe */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col justify-center items-center min-h-screen p-4 md:p-8 font-sans antialiased">

    <!-- Contenitore Centrale Unificato (Perfettamente Centrato) -->
    <div class="w-full max-w-xl space-y-6 my-auto">
        
        <!-- Header Minimale -->
        <header class="text-center space-y-2">
            <h1 class="text-xl md:text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-apollo-500 to-apollo-900 leading-snug">
                Ipotetico dialogo tra Giacobbe e Dio
            </h1>
            <p class="text-[13px] md:text-[15px] font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-apollo-500 to-apollo-900 uppercase opacity-90">
                Fatto da Matteo Pascali
            </p>
        </header>

        <!-- Layout Singolo Rettangolo -->
        <div class="flex flex-col space-y-4">
            
            <!-- Finestra macOS PDF -->
            <div class="glass-panel rounded-xl p-3 shadow-xl transition-all duration-300 hover:border-apollo-500/20 flex flex-col justify-between">
                <div>
                    <!-- Barra Superiore stile Apple/Mac Light -->
                    <div class="flex items-center justify-between mb-2.5 px-1">
                        <div class="flex items-center space-x-1.5">
                            <span class="w-2.5 h-2.5 rounded-full bg-red-400 inline-block"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-yellow-400 inline-block"></span>
                            <span class="w-2.5 h-2.5 rounded-full bg-green-400 inline-block"></span>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono tracking-tight max-w-[220px] truncate">
                            ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf
                        </div>
                        <div class="w-10"></div>
                    </div>

                    <!-- Area Anteprima PDF Cliccabile -->
                    <a href="ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf" target="_blank" class="group relative block w-full h-56 rounded-lg overflow-hidden bg-apollo-50 border border-slate-200/60 focus:outline-none focus:ring-2 focus:ring-apollo-500/30">
                        <!-- Embed anteprima PDF -->
                        <embed src="ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf#toolbar=0&navpanes=0&scrollbar=0" type="application/pdf" class="absolute inset-0 w-full h-full border-none pointer-events-none opacity-40 group-hover:opacity-50 transition-opacity duration-500">

                        <!-- Contenuto centrale -->
                        <div class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-10 bg-white/30 group-hover:bg-white/10 transition-colors duration-300">
                            <div class="w-10 h-10 rounded-full bg-white flex items-center justify-center border border-slate-200 shadow-sm mb-2 group-hover:scale-105 group-hover:bg-apollo-50 group-hover:border-apollo-500/30 transition-all duration-300">
                                <!-- Icona PDF / Documento -->
                                <svg class="w-5 h-5 text-apollo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                                </svg>
                            </div>
                            <span class="text-xs font-semibold text-slate-700 group-hover:text-apollo-600 transition-colors duration-300">
                                Clicca per aprire il PDF
                            </span>
                        </div>
                        <div class="absolute inset-0 bg-apollo-500/[0.03] opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </a>
                </div>
            </div>

            <!-- Riquadro Scarica File -->
            <div class="glass-panel rounded-xl p-4 shadow-lg">
                <div class="flex flex-col space-y-1.5">
                    <span class="text-[10px] font-bold tracking-widest text-apollo-500 uppercase">
                        Documento PDF
                    </span>
                    <div class="flex items-center space-x-2">
                        <!-- Nome File -->
                        <div class="flex-grow bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 flex items-center overflow-x-auto whitespace-nowrap font-mono text-xs select-all no-scrollbar">
                            <span class="text-slate-600 font-medium">ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf</span>
                        </div>

                        <!-- Pulsante Scarica File -->
                        <a href="ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf" download="ipotetico dialogo tra Giacobbe e Dio - episodio della lotta.pdf" class="flex items-center justify-center space-x-1.5 bg-apollo-500 hover:bg-apollo-600 text-white font-semibold px-4 py-2 rounded-lg transition-all duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-apollo-500/30 shrink-0">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>
                            <span class="text-xs">Scarica file</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
