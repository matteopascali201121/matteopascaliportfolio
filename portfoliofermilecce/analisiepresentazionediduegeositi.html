            <!-- Sezione Copia Link -->
            <div class="flex flex-col space-y-1.5">

                    <!-- Pulsante Copia Link -->
                    <button onclick="copiaDato('https://matteos-work.my.canva.site/sessione-2-analisi-e-presentazione-di-due-geositi-matteo-pascali', 'btn-copia-link', 'testo-copia-link', 'icona-copia-link', 'icona-spunta-link')" id="btn-copia-link" class="flex items-center justify-center space-x-1 bg-apollo-500 hover:bg-apollo-600 text-white font-semibold px-3.5 py-2 rounded-lg transition-all duration-200 active:scale-95 focus:outline-none focus:ring-2 focus:ring-apollo-500/30 shrink-0">

                        <svg id="icona-spunta-link" class="w-3.5 h-3.5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            <!-- Feedback copia unico e discreto -->
            <p id="notifica-successo" class="text-emerald-600 text-[10px] text-center mt-1 font-medium opacity-0 transition-opacity duration-300">
                Link copiato negli appunti!
            </p>
        </div>

    </div>

    <!-- Script di Copia Sicura e Feedback -->
    <script>
        function copiaDato(testoDaCopiare, btnId, testoId, iconaCopiaId, iconaSpuntaId) {
            const inputTemporaneo = document.createElement("input");
            inputTemporaneo.value = testoDaCopiare;
            document.body.appendChild(inputTemporaneo);
            inputTemporaneo.select();
            inputTemporaneo.setSelectionRange(0, 99999);
            
            try {
                const copiato = document.execCommand('copy');
                if (copiato) {
                    mostraStatoSuccesso(btnId, testoId, iconaCopiaId, iconaSpuntaId);
                }
            } catch (err) {
                console.error("Errore nella copia: ", err);
            }
            
            document.body.removeChild(inputTemporaneo);
        }

        function mostraStatoSuccesso(btnId, testoId, iconaCopiaId, iconaSpuntaId) {
            const btn = document.getElementById(btnId);
            const testo = document.getElementById(testoId);
            const iconaCopia = document.getElementById(iconaCopiaId);
            const iconaSpunta = document.getElementById(iconaSpuntaId);
            const notifica = document.getElementById("notifica-successo");

            // Configura stato attivo (Successo)
            btn.classList.replace("bg-apollo-500", "bg-emerald-600");
            btn.classList.replace("hover:bg-apollo-600", "hover:bg-emerald-700");
            testo.innerText = "Copiato";
            
            iconaCopia.classList.add("hidden");
            iconaSpunta.classList.remove("hidden");
            notifica.classList.replace("opacity-0", "opacity-100");

            // Ripristina lo stato precedente dopo 2 secondi
            setTimeout(() => {
                btn.classList.replace("bg-emerald-600", "bg-apollo-500");
                btn.classList.replace("hover:bg-emerald-700", "hover:bg-apollo-600");
                testo.innerText = "Copia";
                
                iconaCopia.classList.remove("hidden");
                iconaSpunta.classList.add("hidden");
                notifica.classList.replace("opacity-100", "opacity-0");
            }, 2000);
        }
    </script>
